logistics:
  road:
    source: osrm                       # precomputed once via the OSRM demo server, cached in data/routes/
    truck_time_factor: 1.35            # ILLUSTRATIVE: car-routed time → military/logistics truck
    handling_hours: 3                  # ILLUSTRATIVE: pick, load, paperwork, unload
    fallback_detour_factor: 1.4        # used only when OSRM is unreachable: great-circle × factor …
    fallback_speed_kmh: 40             # … at this average speed
  air:
    handling_hours: 4                  # ILLUSTRATIVE: airlift tasking, load, taxi, unload
    carrier_type: VAH                  # airlift needs a ready Vahak (checked in Stage 6)
  seasonal_closures:
    # ILLUSTRATIVE calendar: road routes touching these nodes are closed between the dates (inclusive, MM-DD).
    - {node: HIM, from: "11-15", to: "05-15", reason: "High passes closed by snow"}

missions:
  # Daily sortie demand per base & type = aircraft × sorties_per_day × base tempo × weekday factor × noise.
  weekend_factor: 0.55
  demand_noise_cv: 0.15
  criticality_mix:                     # probability of a day's mission package criticality
    default: {training: 0.55, routine: 0.35, operational: 0.10}
    ARV:     {training: 0.40, routine: 0.40, operational: 0.20}
    HIM:     {training: 0.35, routine: 0.40, operational: 0.25}
