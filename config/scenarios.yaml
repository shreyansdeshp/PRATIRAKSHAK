# Stress-test scenarios (SPEC §9.6, U3). All SIMULATED; magnitudes ILLUSTRATIVE.
seeds: 10                 # ≥ 10 per policy × scenario (SPEC)
sensitivity_seeds: 5
horizon_days: 90

scenarios:
  base:
    label: Normal operations
  surge:
    label: Surge ×2
    sortie_multiplier: 2.0
    from_day: 0
    fault_hazard_multiplier: 1.5   # heavier usage → more thermal/vibration cycles → more sensor faults
  strike:
    label: Strike on Aravalli
    day: 20
    base: ARV
    bay_loss_fraction: 0.6
    store_lost: true
    damaged_aircraft: 3            # random tails at the base: structure +0.5 damage, one system fails
  supply:
    label: Supply cut (Ladakh)
    road_closed_nodes: [HIM]       # all road routes touching HIM closed for the whole horizon
    vendor_extra_hours: 72
  weather:
    label: Dust & monsoon
    stress_add:
      ARV: {dust: 0.35, heat: 0.10}
      HIM: {dust: 0.30, cold: 0.10}
      SAH: {wet: 0.30, humidity: 0.20}
      KAV: {humidity: 0.20, salinity: 0.10}

late_detection_days: [1, 3, 7]

baselines:
  p1_fraction: 0.6                 # fixed-interval: the fleet's existing practice (same as the D+0 history)
  p1_engine_fraction: 0.6          # engines overhauled at 0.6 × median run-to-failure life of their subset
  p2_signature_fraction: 0.7       # raw alarm when the 3-day mean has moved 70 % of the way to the failure signature
  p2_engine_z: 2.0                 # engines: HPC sensor group (T30, Ps30, P30) z-score alarm
